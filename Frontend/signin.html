<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReBin-SignIn</title>

    <link rel="stylesheet" href="/Style/singin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <div class="box1">
            <h1>Welcome</h1>
            <h2>to</h2>
            <img src="/img/white-logo.png">
            <p>Don't Have an Account ?</p>
            <button onclick="document.location='/signup'">Sign Up</button>
        </div>
        <div class="inputBox">
            <h1>Sign IN</h1>
            <form id="signinform">
                <div class="input">
                    <label>Username :</label>
                    <input type="text" id="username">
                </div>
                <div class="input">
                    <label>Password :</label>
                    <input type="text" id="password">
                </div>
                <!-- <div class="checkpass">
                    <input type="checkbox" id="passcheck">
                    <label for="passcheck">แสดงรหัสผ่าน</label>
                </div>
                 -->
            </form>
            <button onclick="signin()">Sign In</button>
        </div>
    </div>

    <script>
        
        async function signin() {
            
    
        

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                
                const response = await fetch('/api/signIn/',{
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('เข้าสู้ระบบเรียบร้อย');

                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    if (data.user.role === 'admin') {
                        window.location = '/admindashboard';
                    } else {
                        document.location = '/main';
                    }
                } else {
                    alert('ไม่สามารถเข้ารู้ระบบได้!!');
                }

            } catch (error) {
                console.error('Error', error);
                alert('Error!! โปรดลองอีกครั้ง')
            }
        }
    
    </script>
</body>
</html>
