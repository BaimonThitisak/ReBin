<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReBin-Price</title>

    <link rel="stylesheet" href="/Style/price.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="nav-bar">
        <div class="logo" onclick="document.location.reload()">
            <img src="/img/white-logo.png">
        </div>
        <div class="space1">
            <p>|</p>
        </div>
        <div class="main" onclick="document.location='/main' ">
            <p>หน้าหลัก</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="price" onclick="document.location='/price' ">
            <p>ราคาขยะ</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="book" onclick="document.location='/booking' ">
            <p>จองคิว</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="wallet" onclick="document.location='/wallet' ">
            <p>ประเป๋าเงิน</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="exit" onclick="openExit()">
            <img src="/img/exit.png">
        </div>
    </div>
    <div class="content">
        <div class="title">
            <h1>ราคาขยะรีไซเคิลประจำวัน</h1>
        </div>
        <div class="priceDT">

            <div class="plastic">
                <h1>พลาสติก-กระดาษ</h1>
                <table>
                    <thead>
                        <tr>
                            <th>รายการ</th>
                            <th>ราคา/กก.</th>
                        </tr>
                    </thead>
                    <tbody id="price-plastic">
                        <tr>
                            <td>

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="metal">
                <h1>โหละ</h1>
                <table>
                    <thead>
                        <tr>
                            <th>รายการ</th>
                            <th>ราคา/กก.</th>
                        </tr>
                    </thead>
                    <tbody id="price-metal">
                        <tr>
                            <td>
                                
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="iron">
                <h1>เหล็ก</h1>
                <table>
                    <thead>
                        <tr>
                            <th>รายการ</th>
                            <th>ราคา/กก.</th>
                        </tr>
                    </thead>
                    <tbody id="price-iron">
                        <tr>
                            <td>
                                
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="glass">
                <h1>แก้ว</h1>
                <table>
                    <thead>
                        <tr>
                            <th>รายการ</th>
                            <th>ราคา/กก.</th>
                        </tr>
                    </thead>
                    <tbody id="price-glass">
                        <tr>
                            <td>
                                
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="exit-Popup">
        <div class="exit-Content">
            <h1>ต้องการออกจากระบบหรือไม่</h1>
            <div class="exit-button">
                <button class="yes" onclick="exit()">ใช่</button>
                <button class="no" onclick="closeExit()">ไม่</button>
            </div>
        </div>
    </div>



    <script>
        function openExit() {
            document.getElementById('exit-Popup').style.display = 'flex' ;
        }
        function closeExit() {
            document.getElementById('exit-Popup').style.display = 'none' ; 
        }
        function exit() {
            document.location='/';
            localStorage.clear();
        }

        async function loadPrice() {
            try {
                
                const response = await fetch('/api/price/');
                const result = await response.json();

                const plastic_table = document.getElementById('price-plastic');
                const metal_table = document.getElementById('price-metal');
                const iron_table = document.getElementById('price-iron');
                const glass_table = document.getElementById('price-glass');




                result.forEach(element => {
                    const row = `
                        <tr>
                            <td>${element.waste_name}</td>
                            <td>${element.price_per_kg}</td>
                        </tr/>
                    `;
                    
                    if (element.waste_types === 'พลาสติก-กระดาษ') {
                        plastic_table.innerHTML += row;
                    }
                    else if (element.waste_types === 'โลหะ') {
                        metal_table.innerHTML += row;
                    }
                    else if (element.waste_types === 'เหล็ก') {
                        iron_table.innerHTML += row;
                    }
                    else if (element.waste_types === 'แก้ว') {
                        glass_table.innerHTML += row;
                    }
                });

            } catch (error) {
                console.error('error : ', error);
            }
        }

        loadPrice();
        
    </script>
</body>
</html>
