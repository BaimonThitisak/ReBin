<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReBin-Booking</title>
    <link rel="stylesheet" href="/Style/booking.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="crossorigin=""></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

</head>
<body>
    
    <div class="nav-bar">
        <div class="logo" onclick="document.location.reload()">
            <img src="/img/white-logo.png">
        </div>
        <div class="space1">
            <p>|</p>
        </div>
        <div class="main" onclick="document.location='/main' ">
            <p>หน้าหลัก</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="price" onclick="document.location='/price' ">
            <p>ราคาขยะ</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="book" onclick="document.location='/booking' ">
            <p>จองคิว</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="wallet" onclick="document.location='/wallet' ">
            <p>ประเป๋าเงิน</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="exit" onclick="openExit()">
            <img src="/img/exit.png">
        </div>
    </div>

    <div class="book-content">
            <h1>Booking</h1>
            
            <h3>สถานที่นัดหมาย</h3>
            
            <div id="map"></div>

    
                <h2>ข้อมูลการนัดหมาย</h2>
                <form id="bookingDT">
                    <p>ชื่อผู้นัดหมาย</p>
                    <input type="text" id="bookname">
                    <p>เบอร์โทร</p>
                    <input type="text" id="tel">
                    <p>วันที่นัดหมาย</p>
                    <input type="date" id="appointment-date">
                    <p>เวลาที่นัดหมาย</p>
                    <input type="time" id="appointment-time">
                </form>
            <button class="bookBT">จองคิว</button>
            

        </div>

    <div id="exit-Popup">
        <div class="exit-Content">
            <h1>ต้องการออกจากระบบหรือไม่</h1>
            <div class="exit-button">
                <button class="yes" onclick="document.location='/'">ใช่</button>
                <button class="no" onclick="closeExit()">ไม่</button>
            </div>
        </div>
    </div>

    


    <script>
        function openExit() {
            document.getElementById('exit-Popup').style.display = 'flex' ;
        }
        function closeExit() {
            document.getElementById('exit-Popup').style.display = 'none' ; 
        }
        
        

        const map = new L.Map('map').setView([13.7563, 100.5018], 13);
        new L.TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
       
        


        let marker;
        let setlat = null;
        let setlng = null;
        const greenIcon = L.icon({
            iconUrl: '/img/pin.png',
            iconSize:     [50, 50], 
            iconAnchor:   [25, 50], 
            popupAnchor:  [0,-50]
        });

        

        function onMapClick(e) {

            setlat = e.latlng.lat;
            setlng = e.latlng.lng;

            if (marker) {
                marker.setLatLng([setlat, setlng]);
            } else {
                marker = L.marker([setlat, setlng], {icon: greenIcon}).addTo(map);
            }
            const popupContent = 'พิกัด : ' + e.latlng.toString();
            marker.bindPopup(popupContent).openPopup();
            
        }
        
        map.on('click', onMapClick);

        const geocoder = L.Control.geocoder({
            defaultMarkGeocode: false
        })
        
        .on('markgeocode', function (e) {
         const latlng = e.geocode.center;
            setlat = latlng.lat;
            setlng = latlng.lng;

            map.setView(latlng, 14);
            if (marker) {
                marker.setLatLng([setlat, setlng]);
            } else {
                marker = L.marker([setlat, setlng]).addTo(map);
            }

        })
        .addTo(map);

        

        
        

    </script>
</body>
</html>
