<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReBin</title>

    <link rel="stylesheet" href="/Style/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="nav-bar">
        <div class="logo" onclick="document.location.reload()">
            <img src="/img/white-logo.png">
        </div>
        <div class="space1">
            <p>|</p>
        </div>
        <div class="main" onclick="document.location='/main' ">
            <p>หน้าหลัก</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="price" onclick="document.location='/price' ">
            <p>ราคาขยะ</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="book" onclick="document.location='/booking' ">
            <p>จองคิว</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="wallet" onclick="document.location='/wallet' ">
            <p>ประเป๋าเงิน</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="exit" onclick="openExit()">
            <img src="/img/exit.png">
        </div>
    </div>

    <div class="content">
        <div class="welcome">
            <h1>ยินดีต้อนรับสู่</h1>
            <img src="/img/rebin-logo.png">
            <h2 id="fullname">ไม่พบข้อมูล</h2>
        </div>
        <div class="bookdetail">
            <h1>ข้อมูลการจอง</h1>
            <div id="detail">
                <div class="DTbox">
                    <div class="DT">
                        <p>ไม่พบข้อมูลการจองคิว</p>
                    </div>
                </div> 
            </div>
        </div>
        
    </div>

    <div id="exit-Popup">
        <div class="exit-Content">
            <h1>ต้องการออกจากระบบหรือไม่</h1>
            <div class="exit-button">
                <button class="yes" onclick="exit()">ใช่</button>
                <button class="no" onclick="closeExit()">ไม่</button>
            </div>
        </div>
    </div>



    <script>
        function openExit() {
            document.getElementById('exit-Popup').style.display = 'flex' ;
        }
        function closeExit() {
            document.getElementById('exit-Popup').style.display = 'none' ; 
        }
        function exit() {
            document.location='/';
            localStorage.clear();
        }

        async function loadfullname() {
            
            const user_id = localStorage.getItem('user_id');
            
            try {
                
                const response = await fetch(`/api/user/${user_id}`);
                const result = await response.json();

                const fullname = document.getElementById('fullname');

                fullname.textContent = result.firstname + " " + result.lastname;


            } catch (error) {
                console.error('error : ',error);
            }
        }

        async function loadBookDetail() {
            
            const user_id = localStorage.getItem('user_id');

            try {
                
                const response = await fetch(`/api/bookdetail/${user_id}`);
                const result = await response.json();

                
                const detail = document.getElementById('detail');


                detail.innerHTML = " ";

                result.forEach(element => {
                    const formattedDate = element.date.slice(0,10);
                    const formattedTime = element.time.slice(0,5);

                    const row = `
                        <div class="DTbox"> 
                            <div class="DT">
                                <p>วันที่จอง : ${formattedDate} </p>
                                <p>เวลา : ${formattedTime} </p>
                                <p>สถานะ : ${element.status}</p>
                            </div>
                        </div>
                    `;
                    
                    
                    detail.innerHTML += row;
                    
                    
                });

            } catch (error) {
                console.error('error : ', error);
            }
        }

        
        loadfullname();
        loadBookDetail();
        
    </script>
</body>
</html>
