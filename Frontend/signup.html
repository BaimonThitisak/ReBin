<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../Style/signup.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">


</head>
<body>
    <div class="container">
        <div class="box1">
            <h1>Welcome</h1>
            <h2>to</h2>
            <img src="../img/white-logo.png">
            <p>rebin แพลตฟอร์มซื้อขายขยะรีไซเคิลออนไลน์ ที่ช่วยให้การจัดการขยะที่บ้านเป็นเรื่องง่าย ผู้ใช้สามารถเช็คราคาขยะได้แบบเรียลไทม์ และกดจองนัดหมายให้เจ้าหน้าที่เข้ารับขยะถึงหน้าบ้านได้ทันที สะดวก รวดเร็ว ได้เงินชัวร์ โดยไม่ต้องเดินทางไปร้านรับซื้อด้วยตัวเอง</p>
            
            <button onclick="document.location='/'">Sign In</button>
        </div>
        <div class="inputBox">
            <h1>Sign Up</h1>
            <form id="signinform">
                <div class="input">
                    <label>Username :</label>
                    <input type="text" id="username">
                </div>
                <div class="row">
                    <div class="input">
                        <label>Firstname :</label>
                        <input type="text" id="firstname">
                    </div>
                    <div class="input">
                        <label>Lastname :</label>
                        <input type="text" id="lastname">
                    </div>
                </div>
                
                <div class="input">
                    <label>Email :</label>
                    <input type="email" id="email">
                </div>
                
                <div class="row">
                    <div class="input">
                        <label>Password :</label>
                        <input type="text" id="password">
                    </div>
                    <div class="input">
                        <label>Confirm Password :</label>
                        <input type="text" id="confirmpassword" >
                    </div>
                </div>
            </form>
            <button>Sign Up</button>
        </div>
    </div>

    <script>

    </script>
</body>
</html>
