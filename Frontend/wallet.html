<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReBin-Wallet</title>

    <link rel="stylesheet" href="/Style/wallet.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="nav-bar">
        <div class="logo" onclick="document.location.reload()">
            <img src="/img/white-logo.png">
        </div>
        <div class="space1">
            <p>|</p>
        </div>
        <div class="main" onclick="document.location='/main' ">
            <p>หน้าหลัก</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="price" onclick="document.location='/price' ">
            <p>ราคาขยะ</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="book" onclick="document.location='/booking' ">
            <p>จองคิว</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="wallet" onclick="document.location='/wallet' ">
            <p>ประเป๋าเงิน</p>
        </div>
        <div class="space">
            <p>|</p>
        </div>
        <div class="exit" onclick="openExit()">
            <img src="/img/exit.png">
        </div>
    </div>
    <div id="exit-Popup">
        <div class="exit-Content">
            <h1>ต้องการออกจากระบบหรือไม่</h1>
            <div class="exit-button">
                <button class="yes" onclick="exit()">ใช่</button>
                <button class="no" onclick="closeExit()">ไม่</button>
            </div>
        </div>
    </div>

    <div class="content">

        <div class="your-wallet">
            <h1>กระเป๋าเงินของคุณ</h1>
            <img src="/img/wallet-2.png">
            <p>จำนวนเงินของคุณ</p>
            <p id="amount">0.00</p>
        </div>
        <div class="withdraw">
            <h1>ถอนเงิน</h1>

            <div class="bank">
                <label>ธนาคารปลายทาง:</label>
                <select id="bank">
                        <option value="scb">ธนาคารไทยพาณิชย์ (SCB)</option>
                        <option value="kbank">ธนาคารกสิกรไทย (KBANK)</option>
                        <option value="bbl">ธนาคารกรุงเทพ (BBL)</option>
                        <option value="ktb">ธนาคารกรุงไทย (KTB)</option>
                        <option value="bay">ธนาคารกรุงศรีอยุธยา (BAY)</option>
                </select>
            </div>
            <div class="bankaccount">
                <label>หมายเลขบัญชีธนาคาร</label>
                <input type="text" id="accountnumber">
            </div>
            <div class="nameaccount">
                <label>ชื่อบัญชี</label>
                <input type="text" id="accountname">
            </div>
            <div class="money">
                <label>จำนวนเงิน</label>
                <input type="number" step="0.01" id="amount_balance">
            </div>
            <button class="bt-withdraw" onclick="openWithdraw()">ถอนเงิน</button>
        
        </div>

    </div>
    <div id="withdraw-Popup">
        <div class="withdraw-Content">
            <h1>ยืนยันการถอนเงิน</h1>
            <div class="exit-button">
                <button class="yes" onclick="withdraw()">ยืนยัน</button>
                <button class="no" onclick="closeWithdraw()">ยกเลิก</button>
            </div>
        </div>
    </div>



    <script>
        function openExit() {
            document.getElementById('exit-Popup').style.display = 'flex' ;
        }
        function closeExit() {
            document.getElementById('exit-Popup').style.display = 'none' ; 
        }
        function exit() {
            document.location='/';
            localStorage.clear();
        }
        function openWithdraw() {
            document.getElementById('withdraw-Popup').style.display = 'flex' ;
        }
        function closeWithdraw() {
            document.getElementById('withdraw-Popup').style.display = 'none' ; 
        }
        async function loadWallet() {
            
            const user_id = localStorage.getItem('user_id');
            
            try {
                
                const response = await fetch(`/api/user/${user_id}`);
                const result = await response.json();

                const p_amount = document.getElementById('amount');

                p_amount.textContent = result.wallet_balance ?? '0.00';


            } catch (error) {
                console.error('error : ',error);
            }
        }

        loadWallet();

        async function withdraw() {
            const bankCode = document.getElementById('bank').value;
            const accountnumber = document.getElementById('accountnumber').value;
            const accountname = document.getElementById('accountname').value;
            const amount = document.getElementById('amount_balance').value;
            const userid = localStorage.getItem('user_id');

            if (!accountnumber) {
                alert('กรุณาใส่หมายเลขธนาคาร');
                closeWithdraw()
                return;
            }
            if (!accountname) {
                alert('กรุณาใส่ชื่อบัญชีธนาคาร');
                closeWithdraw()
                return;
            }
            if (!amount) {
                alert('กรุณาใส่จำนวนเงิน');
                closeWithdraw()
                return;
            }

            try {
                const response = await fetch('/api/withdraw/',{
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        userid: userid,
                        bankCode: bankCode,
                        accountnumber: accountnumber,
                        accountname: accountname,
                        amount: amount,
                    })
                })
                const result = await response.json();
                if (response.ok) {
                    alert('ถอนเงินเรียบร้อย');
                } else {
                    alert('ถอนเงินผิดพลาด สาเหตุ: ' + (result.error || result.message || 'ไม่ทราบสาเหตุ'));
                    console.log('Error :', result);
                }
            } catch (error) {
                console.error('Error', error);
                alert('Error! โปรดลองใหม่');
            }
            closeWithdraw();
            document.location.reload();
        }

    </script>
    
</body>
</html>
